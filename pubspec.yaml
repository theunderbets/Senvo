name: senvo_health
description: "Senvo camera-based PPG vitals research application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  permission_handler: ^12.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  fl_chart: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  tflite_flutter: ^0.11.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.1.2
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.4
  http: ^1.2.0
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^10.1.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/senvo_logo_original.png"
  adaptive_icon_background: "#0F1B24"
  adaptive_icon_foreground: "assets/images/senvo_logo_original.png"

flutter_native_splash:
  color: "#0F1B24"
  image: "assets/images/senvo_logo_original.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/models/senvo_vitals.tflite
    - assets/models/model_metadata.json
    - assets/images/logo.png
    - assets/images/senvo_logo.png
    - assets/images/senvo_logo_original.png
    - assets/images/skill_india.jpg
    - assets/images/make_in_india.jpg
    - assets/images/cvrgu_logo.jpg
